name: Deploy to GitHub Pages

on:
  push:
    branches: ['claude/cinematography-ui-ux-flows-XSLgG', 'main']

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Set this to your deployed backend URL when you have one
          # e.g. https://cineassist-api.onrender.com/api
          VITE_API_URL: ${{ vars.VITE_API_URL || '' }}
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
