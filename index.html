<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineAssist AI — Cinematography System</title>
    <script>
      // Set the theme before CSS paints, so a light-theme user never sees a dark flash.
      try {
        var a = JSON.parse(localStorage.getItem('cineassist_appearance') || '{}')
        var t = a.theme === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : (a.theme || 'dark')
        document.documentElement.dataset.theme = t
        if (a.highContrast) document.documentElement.dataset.contrast = 'high'
      } catch (e) { document.documentElement.dataset.theme = 'dark' }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
