    <title>CineAssist AI — Cinematography System</title>
    <script>
      // Set the theme before CSS paints, so a light-theme user never sees a dark flash.
      try {
        var a = JSON.parse(localStorage.getItem('cineassist_appearance') || '{}')
        var t = a.theme === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : (a.theme || 'dark')
        document.documentElement.dataset.theme = t
        if (a.highContrast) document.documentElement.dataset.contrast = 'high'
      } catch (e) { document.documentElement.dataset.theme = 'dark' }
    </script>
